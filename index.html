<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>中部咖啡廳彙整</title>
  <meta name="description" content="中部咖啡廳彙整（台中市、苗栗縣、彰化縣）：依縣市、行政區與特色篩選，附地址、營業時間、公休日與地圖連結">
  <!-- PWA：安裝到主畫面 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#6f4e37" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1915" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="中部咖啡">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 版本號：每次修改 style.css、cafes.js、app.js 後請一起更新，
       並同步更新 sw.js 的 VERSION，讓瀏覽器與離線快取都換成新版 -->
  <link rel="stylesheet" href="style.css?v=20261117-3">
</head>
<body>
  <header class="site-header">
    <h1>中部咖啡廳彙整</h1>
    <p class="subtitle">
      收錄台中市、苗栗縣、彰化縣，依縣市、行政區與特色篩選，點「地圖」直接導航。
      資料查詢日期：<span id="checked-at"></span>，營業時間可能變動，出發前請先確認店家公告。
    </p>
  </header>

  <main>
    <section class="card filters" aria-label="篩選">
      <div class="field">
        <label for="search">搜尋</label>
        <input id="search" type="search" placeholder="店名、地址或特色" autocomplete="off">
      </div>
      <div class="field">
        <label for="city">縣市</label>
        <select id="city">
          <option value="">全部縣市</option>
        </select>
      </div>
      <div class="field">
        <label for="district">行政區（區、鄉、鎮、市）</label>
        <select id="district">
          <option value="">全部行政區</option>
        </select>
      </div>
      <fieldset class="field">
        <legend>特色（可多選，需全部符合；其他特色請用搜尋）</legend>
        <div id="tag-filters" class="chips"></div>
      </fieldset>
      <button id="reset-btn" type="button" class="btn btn-secondary">清除篩選</button>
    </section>

    <p id="result-count" class="result-count" aria-live="polite"></p>
    <ul id="cafe-list" class="cafe-list"></ul>

    <section class="card sources" aria-labelledby="sources-title">
      <h2 id="sources-title">資料來源</h2>
      <p class="muted">
        由 AI 透過網路搜尋整理以下公開文章；標示「⚠ 需確認」的店家，來源之間互相矛盾或查不到資料。
      </p>
      <ul id="source-list"></ul>
    </section>
  </main>

  <script src="cafes.js?v=20261117-3"></script>
  <script src="app.js?v=20261117-3"></script>
</body>
</html>
