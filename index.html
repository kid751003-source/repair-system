<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>報修登記</title>
  <!-- 版本號：每次修改 style.css、config.js、app.js 後請一起更新，讓瀏覽器重新下載 -->
  <link rel="stylesheet" href="style.css?v=20261112-2">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p class="subtitle">填寫下方表單送出報修，清單會顯示最近 20 筆。示範系統，請勿填寫真實姓名。</p>
  </header>

  <main>
    <div id="config-warning" class="message message-error" role="alert" hidden></div>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <form id="report-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人 <span class="req">必填</span></label>
          <input id="reporter_name" name="reporter_name" type="text" maxlength="50"
                 autocomplete="name" required>
        </div>

        <div class="field">
          <label for="location">地點或部門 <span class="req">必填</span></label>
          <input id="location" name="location" type="text" maxlength="100" required>
        </div>

        <div class="field">
          <label for="category">類別 <span class="req">必填</span></label>
          <select id="category" name="category" required>
            <option value="" selected disabled>請選擇</option>
            <option value="設備">設備</option>
            <option value="網路">網路</option>
            <option value="環境">環境</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="field">
          <label for="description">問題說明 <span class="req">必填</span></label>
          <textarea id="description" name="description" rows="4" maxlength="1000" required></textarea>
          <div class="hint"><span id="desc-count">0</span> / 1000 字</div>
        </div>

        <fieldset class="field">
          <legend>緊急程度</legend>
          <div class="segmented">
            <label><input type="radio" name="urgency" value="低"><span>低</span></label>
            <label><input type="radio" name="urgency" value="中" checked><span>中</span></label>
            <label><input type="radio" name="urgency" value="高"><span>高</span></label>
          </div>
        </fieldset>

        <button id="submit-btn" type="submit" class="btn">送出報修</button>
        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">最近報修</h2>
        <button id="refresh-btn" type="button" class="btn btn-secondary">重新整理</button>
      </div>
      <p id="list-status" class="list-status" aria-live="polite">載入中…</p>
      <ul id="report-list" class="report-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script src="config.js?v=20261112-2"></script>
  <script src="app.js?v=20261112-2"></script>
</body>
</html>
