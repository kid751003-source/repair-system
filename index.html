<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>島嶼咖啡地圖</title>
  <meta name="description" content="島嶼咖啡地圖：全台 22 縣市，依縣市、行政區與特色篩選，附地址、營業時間、公休日與地圖連結">
  <!-- PWA：安裝到主畫面 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#17120f">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="島嶼咖啡">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- 版本號：每次修改 style.css、cafes.js、app.js 後請一起更新，
       並同步更新 sw.js 的 VERSION，讓瀏覽器與離線快取都換成新版 -->
  <link rel="stylesheet" href="style.css?v=20261117-13">
</head>
<body>
  <a class="skip-link" href="#cafe-list">跳到咖啡廳清單</a>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-title">
        <img class="hero-icon" src="icons/icon.svg" alt="" width="56" height="56">
        <h1>島嶼咖啡地圖</h1>
      </div>
      <p class="hero-sub"><span>今天想去哪裡喝咖啡？</span><span>就出發吧。</span></p>
      <ul class="stats" aria-label="收錄概況">
        <li><strong id="stat-cafes">–</strong><span>間咖啡廳</span></li>
        <li><strong id="stat-cities">–</strong><span>個縣市</span></li>
        <li><strong id="checked-at">–</strong><span>資料查詢日</span></li>
      </ul>

      <!-- PWA 安裝：Android／電腦顯示按鈕，iPhone 顯示加入主畫面教學；已安裝時都不顯示 -->
      <div class="install-row">
        <button id="install-btn" class="install-btn" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11 M7 10l5 5 5-5 M5 20h14"/></svg>
          安裝 App
        </button>
        <p id="ios-install-hint" class="install-hint" hidden>
          加到主畫面：點 Safari 下方的「分享」<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4 M8 8l4-4 4 4 M6 11v9h12v-9"/></svg>，再選「加入主畫面」。
          <button id="ios-hint-close" type="button" aria-label="關閉提示">✕</button>
        </p>
      </div>

      <!-- 景觀咖啡廳照片投影片：內容由 slides.js 提供，app.js 產生 -->
      <section id="slideshow" class="slideshow" aria-roledescription="carousel" aria-label="景觀咖啡廳照片" hidden>
        <ul class="slides" id="slides"></ul>
        <button class="slide-nav prev" type="button" aria-label="上一張">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <button class="slide-nav next" type="button" aria-label="下一張">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <div class="slide-dots" role="group" aria-label="選擇照片"></div>
      </section>
    </div>
  </header>

  <main>
    <section class="panel filters" aria-label="篩選">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="search">搜尋</label>
        <input id="search" type="search" placeholder="搜尋店名、地址或特色" autocomplete="off">
      </div>
      <div class="selects">
        <div class="field">
          <label for="city">縣市</label>
          <select id="city">
            <option value="">全部縣市</option>
          </select>
        </div>
        <div class="field">
          <label for="district">行政區</label>
          <select id="district">
            <option value="">全部行政區</option>
          </select>
        </div>
      </div>
      <fieldset class="field">
        <legend>特色 <span class="legend-hint">可多選，需全部符合；其他特色請用搜尋</span></legend>
        <div id="tag-filters" class="chips"></div>
      </fieldset>
    </section>

    <div class="toolbar">
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <button id="reset-btn" type="button" class="link-btn">清除篩選</button>
    </div>

    <ul id="cafe-list" class="cafe-list"></ul>

    <details class="panel sources">
      <summary><h2>資料來源（<span id="source-count"></span> 篇）</h2></summary>
      <p class="muted">
        由 AI 透過網路搜尋整理以下公開文章；標示「需確認」的店家，來源之間互相矛盾或查不到資料。
      </p>
      <ul id="source-list"></ul>
    </details>
  </main>

  <footer class="site-footer">
    <p>營業時間與公休日常會變動，出發前請以店家官方公告為準。</p>
    <p>資料由 AI 整理自公開網路文章，僅供參考。</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" type="button" hidden></button>
  </div>

  <button id="to-top" class="to-top" type="button" aria-label="回到頂端" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg>
  </button>

  <script src="cafes.js?v=20261117-13"></script>
  <script src="slides.js?v=20261117-13"></script>
  <script src="app.js?v=20261117-13"></script>
</body>
</html>
